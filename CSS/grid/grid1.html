<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 80vw;
            height: 80vh;
            /* border: 2px solid black; */
            box-shadow: 2px 2px 3px bisque,-2px -2px 3px bisque;
            background-color: aliceblue;
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-rows: 30px 1fr 30px;
            /* grid-template-rows: repeat(3,1fr); */
            /* grid-template-rows: 100 px repeat(3,1fr); */
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .box
        {
            /* width: 100px; */
            /* height: 100px; */
            margin: 3px;

            background-color: antiquewhite;
        }
        #box1{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        #box3{
            grid-column-start: 2;
            grid-column-end: 4;
        }
        #box4{
            grid-column-start: 1;
            grid-column-end: 4;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        
    </div>
</body>
</html>
