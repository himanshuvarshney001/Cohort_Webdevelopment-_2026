<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            /* border: 2px solid black; */
            width: 80vw;
            height: 50vh;
            display: flex;
            margin: 0 auto;
            /* margin-top: 50%; */
            transform: translatey(50%);
            justify-content: space-between;
            border-radius: 20px;
            overflow: hidden;
            flex-wrap: wrap;
        }
        .mug
        {
            width: 50%;
            height: 100%;
            /* border: 2px solid black; */
        }
        #img{
            width: 100%;
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            object-fit: cover;
        }
        .desc{
            /* border: 2px solid black; */
            width: 50%;
            height: 100%;
            padding: 30px;
        }
        .desc h3{
            letter-spacing: .2rem;
            color: rgb(102, 101, 101);
        }
        .desc h2{
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: x-large;
        }
        .desc p{
            margin-bottom: 20px;
            margin-top: 20px;
        }
        #price {
            font-size: 2.5em;
            font-weight: 700;
            color: rgb(34, 150, 34);
        } 
        #btn{
             width: 100%;
             margin-top: 60px;
             padding: 10px;
             border-radius: 20px;
             font-size: x-large;
             background-color: rgb(34, 150, 34);
             border: none;
        }
        @media (max-width: 768px) {

    .container {
        width: 95%;
        height: auto;
        flex-direction: column;
        transform: translateY(50px);
    }
    .mug,
    .desc {
        width: 100%;
    }
    .mug {
        height: 300px;
    }
    .desc {
        height: auto;
        padding: 20px;
    }
    .desc h2 {
        font-size: 1.8rem;
    }
    #price {
        font-size: 2rem;
    }
    del {
        font-size: 1.2rem !important;
    }
    #btn {
        font-size: 1rem;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="mug"><img id="img" src="images/coffeCup.jpg" alt=""></div>
        <div class="desc">
            <h3>COFFEE MUG</h3>
            <h2>Coffee with Himanshu Varshney</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi incidunt totam cumque voluptate dolor eum reprehenderit enim itaque placeat aperiam, assumenda sapiente, at odit harum fugiat delectus provident minus accusamus!</p>
            <span id="price">₹149</span>
            <del style="font-size: 1.5rem; margin-left: 20px;">₹300</del>
            <button id="btn">Add to cart</button>
        </div>
    </div>
</body>
</html>
