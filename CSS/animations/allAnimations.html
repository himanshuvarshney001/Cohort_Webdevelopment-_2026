<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid black;
        width: 100vw;
        flex-wrap: wrap;
        height: 100vh;
      }
      .box {
        /* border: 2px solid black; */
        display: flex;
        justify-content: center;
        align-items: center;
        width: 25%;
        height: 10%;
        margin: 1rem;
        border-radius: 20px;
        overflow: hidden;
      }
      #A1 {
        width: 100%;
        height: 100%;
        position: relative;
        /* padding: 15px 40px; */
        font-size: 18px;
        /* border: 2px solid blue; */
        background: wheat;
        color: black;
        cursor: pointer;
        border: none;
        z-index: 1;
      }
      #A1::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #b4a9a9;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 2s ease;
        z-index: -1;
      }
      #A1:hover::before {
        transform: scaleX(1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <button id="A1">Hover Me</button>
      </div>
      <div class="box">
        <div id="A2"></div>
      </div>
    </div>
  </body>
</html>
