<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      Zerodha: Online brokerage platform for stock trading &amp; investing
    </title>
    <link rel="icon" type="image/png" href="zerodha_tittle_log.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        z-index: 1000;
      }

      .container {
        max-width: 1100px;
        margin: auto;
        padding: 0 20px;
        height: 70px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo-img {
        width: 130px;
      }

      .navbar-links {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 45px;
      }

      .navbar-links a {
        text-decoration: none;
        color: #666;
        font-size: 1rem;
        transition: color 0.3s;
      }

      .navbar-links a:hover {
        color: #387ed1;
      }
      .homePage
      {
        box-sizing: border-box;
        /* border: 2px solid black; */
        height: 450px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 110px;
    }
    .homeimg
    {
        width: 800px;
    }
    .info
    {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #666;
        font-size: 2rem;
        font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    .btn
    {
        margin-top: 20px;
        padding: 15px 50px 15px 50px;
        font-size: 1.2rem;
        border-radius: 100px;
        border: none;
        background-color: #387ed1;
        color: #fff;
        transition: .3s;
    }
    .btn:hover{
        background-color: #666;
    }
    .info h2,p
    {
        margin: 10px;
    }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a href="#">
          <img class="logo-img" src="logo.svg" alt="Zerodha Logo" />
        </a>

        <ul class="navbar-links">
          <li><a href="#">Signup</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Pricing</a></li>
          <li><a href="#">Support</a></li>
        </ul>
      </div>
    </nav>
    <main class="homePage">
             <img src="homePage.svg" class="homeimg" alt="">
    </main>
    <section class="info">
        <h2>Invest in everything</h2>
        <p>Online platform to invest in stocks, derivatives, mutual funds, ETFs, bonds, and more.</p>
        <button class="btn">Signup for free</button>
    </section>
  </body>
</html>
