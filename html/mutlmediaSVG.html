<!-- SVG ek code se banne wali image hai.
PNG/JPG mein image pixels se banti hai, jabki SVG mein image shapes (circle, rectangle, line, etc.) se banti hai. Isliye SVG ko kitna bhi zoom karo, quality kharab nahi hoti. 🚀 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Shapes</title>
</head>
<body>

    <h1>SVG Graphics Example</h1>

    <svg width="400" height="250">

        <!-- Rectangle -->
        <rect
            x="20"
            y="20"
            width="150"
            height="80"
            fill="skyblue"
            stroke="black"
            stroke-width="2">
        </rect>

        <!-- Circle -->
        <circle
            cx="280"
            cy="60"
            r="40"
            fill="orange"
            stroke="black"
            stroke-width="2">
        </circle>

    </svg>

</body>
</html>
