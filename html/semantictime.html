<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Element Example</title>
</head>
<body>

    <h1>Upcoming Events</h1>

    <article>
        <h2>ChaiCode Web Development Workshop</h2>
        
        <p>
            Event Date:
            <time datetime="2026-07-15">
                July 15, 2026
            </time>
        </p>

        <p>
            Start Time:
            <time datetime="2026-07-15T10:00">
                10:00 AM
            </time>
        </p>

        <p>
            End Time:
            <time datetime="2026-07-15T13:00">
                1:00 PM
            </time>
        </p>
    </article>

    <article>
        <h2>JavaScript Bootcamp</h2>

        <p>
            Registration Deadline:
            <time datetime="2026-08-01">
                August 1, 2026
            </time>
        </p>
    </article>

    <footer>
        <p>
            Last Updated:
            <time datetime="2026-06-24T15:30">
                June 24, 2026 at 3:30 PM
            </time>
        </p>
    </footer>

</body>
</html>
