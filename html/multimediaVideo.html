<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Example</title>
</head>
<body>

    <h1>🎥 ChaiCode Introduction Video</h1>

    <video
        controls
        width="800"
        poster="thumbnail.jpg">

        <source src="chaicode-intro.mp4" type="video/mp4">
        <source src="chaicode-intro.webm" type="video/webm">
        <source src="chaicode-intro.ogg" type="video/ogg">

        Your browser does not support the video element.
    </video>

    <p>
        Watch this introductory video to learn about ChaiCode courses,
        projects, and community support.
    </p>

</body>
</html>
