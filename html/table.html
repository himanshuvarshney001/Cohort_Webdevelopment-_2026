<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        th,td{
            padding: 10px;
            padding-left: 25px;
            padding-right:25px;
        }
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
       <thead>
          <tr>
            <th colspan="6">WEEKLY CLASS SCHEDULE</th>
          </tr>
          <tr>
            <th>Time</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
          </tr>
       </thead>
       <tbody>
        <tr>
           <td>8:00 - 9:00</td>
           <td>Mathematics</td>
           <td>Physics</td>
           <td>Mathematics</td>
           <td>Chemistery</td>
           <td>Biology</td>
        </tr>
        <tr>
            <td>9:00 - 10:00</td>
            <td>Computer science</td>
            <td>English</td>
            <td>Physics</td>
            <td>Computer Science</td>
            <td>DBMS</td>
        </tr>
        <tr>
            <td>10:00 - 10:15</td>
            <th colspan="5">Break</th>
        </tr>
       </tbody>
       <tfoot>
        <tr>
            <td>total</td>
            <th colspan="6">30.00</th>
        </tr>
       </tfoot>
    </table>
</body>
</html>
