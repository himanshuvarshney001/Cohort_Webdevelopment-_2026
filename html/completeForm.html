<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaiCode Course Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        form {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 15px;
        }

        legend {
            font-weight: bold;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }

        .inline {
            display: inline-block;
            margin-right: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <form action="/register" method="post" enctype="multipart/form-data">

        <h1>☕ ChaiCode Course Registration Form</h1>
        <p>Fill out the form below to enroll in your preferred ChaiCode course.</p>

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name *</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                required
                maxlength="50"
                pattern="[A-Za-z ]+"
                title="Only letters and spaces are allowed">

            <label for="email">Email Address *</label>
            <input
                type="email"
                id="email"
                name="email"
                required>

            <label for="phone">Phone Number *</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                required
                pattern="[0-9]{10}"
                title="Enter a 10-digit phone number">

            <label for="age">Age *</label>
            <input
                type="number"
                id="age"
                name="age"
                min="16"
                max="60"
                required>

            <label for="dob">Date of Birth</label>
            <input
                type="date"
                id="dob"
                name="dob">
        </fieldset>

        <!-- Course Details -->
        <fieldset>
            <legend>Course Details</legend>

            <label for="course">Select Course *</label>
            <select id="course" name="course" required>
                <option value="">--Choose a Course--</option>
                <option value="web-dev">Full Stack Web Development</option>
                <option value="javascript">JavaScript Mastery</option>
                <option value="react">React Development</option>
                <option value="backend">Backend Development</option>
                <option value="devops">DevOps & Deployment</option>
            </select>

            <label for="batch">Preferred Batch</label>
            <input type="text" id="batch" name="batch" list="batches">

            <datalist id="batches">
                <option value="Morning Batch">
                <option value="Afternoon Batch">
                <option value="Evening Batch">
                <option value="Weekend Batch">
            </datalist>

            <label>Mode of Learning *</label>

            <div class="inline">
                <input type="radio" id="online" name="mode" value="online" required>
                <label for="online" style="display:inline;">Online</label>
            </div>

            <div class="inline">
                <input type="radio" id="offline" name="mode" value="offline">
                <label for="offline" style="display:inline;">Offline</label>
            </div>
        </fieldset>

        <!-- Skills & Interests -->
        <fieldset>
            <legend>Skills & Interests</legend>

            <label>Technologies You Know</label>

            <div>
                <input type="checkbox" id="html" name="skills[]" value="HTML">
                <label for="html" style="display:inline;">HTML</label>
            </div>

            <div>
                <input type="checkbox" id="css" name="skills[]" value="CSS">
                <label for="css" style="display:inline;">CSS</label>
            </div>

            <div>
                <input type="checkbox" id="js" name="skills[]" value="JavaScript">
                <label for="js" style="display:inline;">JavaScript</label>
            </div>

            <div>
                <input type="checkbox" id="react" name="skills[]" value="React">
                <label for="react" style="display:inline;">React</label>
            </div>

            <div>
                <input type="checkbox" id="node" name="skills[]" value="Node.js">
                <label for="node" style="display:inline;">Node.js</label>
            </div>
        </fieldset>

        <!-- Uploads -->
        <fieldset>
            <legend>Documents</legend>

            <label for="resume">Upload Resume *</label>
            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,.doc,.docx"
                required>

            <label for="projects">
                Upload Project Files (Optional)
            </label>
            <input
                type="file"
                id="projects"
                name="projects"
                accept=".zip,.pdf,.jpg,.png"
                multiple>
        </fieldset>

        <!-- Additional Information -->
        <fieldset>
            <legend>Additional Information</legend>

            <label for="portfolio">
                Portfolio / GitHub URL
            </label>
            <input
                type="url"
                id="portfolio"
                name="portfolio"
                placeholder="https://github.com/username">

            <label for="motivation">
                Why do you want to join ChaiCode?
            </label>
            <textarea
                id="motivation"
                name="motivation"
                rows="5"
                maxlength="500"
                placeholder="Tell us about your goals..."></textarea>
        </fieldset>

        <!-- Terms -->
        <fieldset>
            <legend>Declaration</legend>

            <input
                type="checkbox"
                id="terms"
                name="terms"
                required>

            <label for="terms" style="display:inline;">
                I agree to the terms and conditions and certify that the information provided is accurate. *
            </label>
        </fieldset>

        <button type="submit">Register Now</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
