<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 Semantic Structure</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }

      header {
        background-color: #333;
        color: white;
        padding: 20px;
        text-align: center;
      }
      nav {
        background-color: #555;
        padding: 10px;
        text-align: center;
      }
        nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      nav li {
        display: inline-block;
        margin: 0 15px;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      main {
        padding: 20px;
        min-height: 300px;
      }

      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 15px;
      }
    </style>
  </head>

  <body>
    <!-- Header Section -->
    <header>
      <h1>My Website</h1>
      <p>Learning HTML5 Semantic Elements</p>
    </header>
    <!-- Navigation -->
    <nav>
       
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main>
      <h2>Welcome</h2>
      <p>
        HTML5 semantic elements make web pages more meaningful and easier to
        understand for developers, browsers, and search engines.
      </p>
    </main>

    <!-- Footer Section -->
    <footer>
      <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>
  </body>
</html>
